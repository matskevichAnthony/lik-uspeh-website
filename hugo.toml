baseURL = 'https://lik-uspeh.ru'
languageCode = 'ru'
title = 'Гимназия «ЛИК-Успех»'
defaultContentLanguage = 'ru'

# SEO и метаданные
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Настройки сборки
[build]
  writeStats = true

# Параметры темы
[params]
  description = "Частная гимназия «ЛИК-Успех» - качественное образование в Ставрополе"
  keywords = ["гимназия", "частная школа", "образование", "Ставрополь", "ЛИК-Успех"]
  author = "Гимназия «ЛИК-Успех»"
  email = "lik-uspeh@mail.ru"
  phone = "+7 (8652) 77-22-11"
  address = "Фестивальный пр. 19, Ставрополь"
  
  # Социальные сети
  telegram = "https://t.me/lik_uspeh"
  vk = "https://vk.com/likuspeh"
  
  # Настройки блога
  blog_pagination = 6
  posts_per_page = 10

# Меню навигации - Концепция двухъярусной навигации
[menus]
  # Основное меню (6 пунктов для родителей)
  [[menus.main]]
    identifier = "home"
    name = "Главная"
    url = "/"
    weight = 1

  [[menus.main]]
    identifier = "about"
    name = "О гимназии"
    url = "/about/"
    weight = 2

  [[menus.main]]
    identifier = "education"
    name = "Образование"
    url = "/education/"
    weight = 3
    hasChildren = true

  [[menus.main]]
    identifier = "admissions"
    name = "Поступление"
    url = "/admissions/"
    weight = 4

  [[menus.main]]
    identifier = "news"
    name = "Новости"
    url = "/news/"
    weight = 5
    hasChildren = true

  [[menus.main]]
    identifier = "contacts"
    name = "Контакты"
    url = "/contacts/"
    weight = 6

  # Подменю "Образование"
  [[menus.main]]
    identifier = "kindergarten"
    name = "Детский сад"
    url = "/kindergarten/"
    parent = "education"
    weight = 31

  [[menus.main]]
    identifier = "school-programs"
    name = "Школьные программы"
    url = "/education/"
    parent = "education"
    weight = 32


  [[menus.main]]
    identifier = "staff"
    name = "Педагоги"
    url = "/staff/"
    parent = "education"
    weight = 35

  # Подменю "Новости"
  [[menus.main]]
    identifier = "news-announcements"
    name = "Новости"
    url = "/news/"
    parent = "news"
    weight = 51

  [[menus.main]]
    identifier = "blog"
    name = "Блог"
    url = "/blog/"
    parent = "news"
    weight = 52

  # Utility-bar меню (верхняя полоса)
  [[menus.utility]]
    identifier = "organization"
    name = "Сведения об организации"
    url = "/svedeniya-ob-obrazovatelnoy-organizatsii/"
    weight = 1

  [[menus.utility]]
    identifier = "diary"
    name = "Электронный дневник"
    url = "https://login.dnevnik.ru/"
    weight = 2
    external = true


# Organization menu is now dynamically generated from page frontmatter


  # Футер меню - быстрые ссылки
  [[menus.footer_quick]]
    name = "О гимназии"
    url = "/about/"
    weight = 1

  [[menus.footer_quick]]
    name = "Поступление"
    url = "/admissions/"
    weight = 2

  [[menus.footer_quick]]
    name = "Детский сад"
    url = "/kindergarten/"
    weight = 3

  [[menus.footer_quick]]
    name = "Новости"
    url = "/news/"
    weight = 4

  [[menus.footer_quick]]
    name = "Контакты"
    url = "/contacts/"
    weight = 5

  # Футер меню - юридическая информация
  [[menus.footer_legal]]
    name = "Сведения об организации"
    url = "/svedeniya-ob-obrazovatelnoy-organizatsii/"
    weight = 1

  [[menus.footer_legal]]
    name = "Документы"
    url = "/docs/"
    weight = 2



# Настройки таксономий
[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  audience = "audiences"
  subject = "subjects"
  grade = "grades"
  format = "formats"

# Настройки форматов вывода
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

# Настройки RSS
[services.rss]
  limit = 20

# Настройки разметки
[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true

# Настройки обработки изображений
[imaging]
  resampleFilter = "lanczos"
  quality = 85
  anchor = "smart"
