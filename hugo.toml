baseURL = 'https://lik-uspeh.ru'
languageCode = 'ru'
title = 'Гимназия «ЛИК-Успех»'
defaultContentLanguage = 'ru'

# SEO и метаданные
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Настройки сборки
[build]
  writeStats = true

# Параметры темы
[params]
  description = "Частная гимназия «ЛИК-Успех» - качественное образование в Ставрополе"
  keywords = ["гимназия", "частная школа", "образование", "Ставрополь", "ЛИК-Успех"]
  author = "Гимназия «ЛИК-Успех»"
  email = "lik-uspeh@mail.ru"
  phone = "+7 (8652) 77-22-11"
  address = "Фестивальный пр. 19, Ставрополь"
  
  # Социальные сети
  telegram = "https://t.me/lik_uspeh"
  vk = "https://vk.com/likuspeh"
  
  # Настройки блога
  blog_pagination = 6
  posts_per_page = 10

