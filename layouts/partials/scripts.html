<!-- Scripts -->
{{ $script := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $script.Permalink }}" integrity="{{ $script.Data.Integrity }}"></script>

<!-- New Header Mobile menu functionality -->
<script>
// Header navigation toggle functionality
document.addEventListener('click', (e) => {
  const toggle = e.target.closest('[data-nav-toggle], .utility__menu');
  if (!toggle) return;

  const nav = document.getElementById('primary-nav');
  const expanded = toggle.getAttribute('aria-expanded') === 'true';
  toggle.setAttribute('aria-expanded', String(!expanded));

  // Simple reveal on small screens
  if (window.matchMedia('(max-width: 720px)').matches) {
    if (expanded) {
      nav.classList.remove('mobile-visible');
    } else {
      nav.classList.add('mobile-visible');
    }
  }
});

// Close mobile menu when clicking outside
document.addEventListener('click', (e) => {
  const nav = document.getElementById('primary-nav');
  const toggle = e.target.closest('[data-nav-toggle], .utility__menu');
  
  if (!toggle && !nav.contains(e.target)) {
    nav.classList.remove('mobile-visible');
    document.querySelectorAll('[data-nav-toggle], .utility__menu').forEach(btn => {
      btn.setAttribute('aria-expanded', 'false');
    });
  }
});

// Close mobile menu on escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const nav = document.getElementById('primary-nav');
    nav.classList.remove('mobile-visible');
    document.querySelectorAll('[data-nav-toggle], .utility__menu').forEach(btn => {
      btn.setAttribute('aria-expanded', 'false');
    });
  }
});
</script>

<!-- Netlify Identity Widget Script -->
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
