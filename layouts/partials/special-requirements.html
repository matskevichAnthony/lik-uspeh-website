{{ $title := .title }}
{{ $sections := .sections }}

<section class="py-16">
  <div class="container-content">
    <div class="max-w-4xl mx-auto">
      <div class="bg-gradient-to-r from-accent/5 to-primary/5 rounded-2xl p-8 border border-accent/20">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-accent/20 rounded-xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-accent-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-primary mb-2">{{ $title }}</h2>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-{{ len $sections }} gap-8">
          {{ range $sections }}
          <div class="bg-white rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-bold text-primary mb-4">{{ .title }}</h3>
            <ul class="space-y-3">
              {{ range .items }}
              <li class="flex items-start">
                <div class="w-5 h-5 bg-accent/20 rounded-full flex items-center justify-center mr-3 mt-0.5 flex-shrink-0">
                  <div class="w-2 h-2 bg-accent rounded-full"></div>
                </div>
                <span class="text-text-secondary">{{ . }}</span>
              </li>
              {{ end }}
            </ul>
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
