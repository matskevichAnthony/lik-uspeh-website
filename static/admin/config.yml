backend:
  name: git-gateway
  branch: main

# Режим разработки - позволяет редактировать файлы напрямую
local_backend: true

# Media files will be stored in the repo under static/images/uploads
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# Russian localization
locale: 'ru'

# Site URL for preview
site_url: https://matskevichanthony.github.io/lik-uspeh-website/

# Collections define the structure for the different content types
collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Блог" # Used in the UI
    folder: "content/blog" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template
    editor:
      preview: false
    fields: # The fields for each document, usually in front matter
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата публикации", name: "date", widget: "datetime"}
      - {label: "Описание", name: "description", widget: "string", required: false}
      - {label: "Автор", name: "author", widget: "string", required: false}
      - label: "Роль автора"
        name: "author_role"
        widget: "select"
        required: false
        options:
          - {label: "Не указано", value: ""}
          - {label: "Ученик", value: "student"}
          - {label: "Преподаватель", value: "teacher"}
          - {label: "Сотрудник", value: "staff"}
      - label: "Аудитория"
        name: "audiences"
        widget: "select"
        multiple: true
        options:
          - {label: "Родители", value: "parents"}
          - {label: "Ученики", value: "students"}
          - {label: "Преподаватели", value: "teachers"}
        hint: "Для кого предназначена статья"
      - label: "Предметы"
        name: "subjects"
        widget: "select"
        multiple: true
        required: false
        options:
          - {label: "Математика", value: "математика"}
          - {label: "Русский язык", value: "русский язык"}
          - {label: "Литература", value: "литература"}
          - {label: "История", value: "история"}
          - {label: "Обществознание", value: "обществознание"}
          - {label: "Физика", value: "физика"}
          - {label: "Химия", value: "химия"}
          - {label: "Биология", value: "биология"}
          - {label: "География", value: "география"}
          - {label: "Иностранный язык", value: "иностранный язык"}
          - {label: "Информатика", value: "информатика"}
          - {label: "Физическая культура", value: "физическая культура"}
          - {label: "ОБЖ", value: "ОБЖ"}
          - {label: "Искусство", value: "искусство"}
          - {label: "Музыка", value: "музыка"}
          - {label: "Технология", value: "технология"}
      - label: "Классы"
        name: "grade"
        widget: "select"
        multiple: true
        required: false
        options:
          - {label: "1 класс", value: "1"}
          - {label: "2 класс", value: "2"}
          - {label: "3 класс", value: "3"}
          - {label: "4 класс", value: "4"}
          - {label: "5 класс", value: "5"}
          - {label: "6 класс", value: "6"}
          - {label: "7 класс", value: "7"}
          - {label: "8 класс", value: "8"}
          - {label: "9 класс", value: "9"}
          - {label: "10 класс", value: "10"}
          - {label: "11 класс", value: "11"}
      - label: "Формат"
        name: "formats"
        widget: "select"
        multiple: true
        required: false
        options:
          - {label: "Руководство", value: "guide"}
          - {label: "Как сделать", value: "howto"}
          - {label: "Мнение", value: "opinion"}
          - {label: "Кейс", value: "case"}
          - {label: "Интервью", value: "interview"}
          - {label: "Отчет", value: "report"}
      - {label: "Работа ученика", name: "student_work", widget: "boolean", default: false, hint: "Отметьте, если это работа ученика"}
      - {label: "Теги", name: "tags", widget: "list", required: false, hint: "Теги для поиска (хештеги)"}
      - {label: "Черновик", name: "draft", widget: "boolean", default: false}
      - {label: "Содержание", name: "body", widget: "markdown"}

  - name: "news" # News collection
    label: "Новости"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата публикации", name: "date", widget: "datetime"}
      - {label: "Описание", name: "description", widget: "string", required: false}
      - {label: "Автор", name: "author", widget: "string", required: false}
      - {label: "Изображение", name: "image", widget: "image", required: false}
      - {label: "Теги", name: "tags", widget: "list", required: false, hint: "Теги для поиска (хештеги)"}
      - {label: "Черновик", name: "draft", widget: "boolean", default: false}
      - {label: "Содержание", name: "body", widget: "markdown"}

  - name: "gallery" # Gallery collection
    label: "Галерея"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Описание", name: "description", widget: "string", required: false}
      - {label: "Фотография", name: "image", widget: "image"}
      - {label: "Теги", name: "tags", widget: "list", required: false, hint: "Теги для поиска (хештеги)"}
      - {label: "Черновик", name: "draft", widget: "boolean", default: false}


  - name: "docs"
    label: "Нормативные документы"
    folder: "content/docs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Описание", name: "description", widget: "text", required: false}
      - {label: "Категория", name: "category", widget: "select", options: ["Устав", "Положения", "Приказы", "Инструкции", "Другие"], required: false}
      - {label: "Файл документа", name: "file", widget: "file", required: false}
      - {label: "Содержание", name: "body", widget: "markdown", required: false}

  - name: "organization"
    label: "Сведения об организации"
    folder: "content/svedeniya-ob-obrazovatelnoy-organizatsii"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "string", required: false}
      - {label: "Тип", name: "type", widget: "hidden", default: "organization"}
      - {label: "Макет", name: "layout", widget: "hidden", default: "single"}
      - {label: "URL", name: "url", widget: "string", hint: "Например: /svedeniya-ob-obrazovatelnoy-organizatsii/novaya-stranitsa/"}
      - {label: "Последнее обновление", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Вес (порядок)", name: "weight", widget: "number", default: 10}
      - label: "Родительская страница"
        name: "parent"
        widget: "select"
        required: false
        options:
          - {label: "Нет (основной раздел)", value: ""}
          - {label: "Образование", value: "obrazovanie"}
          - {label: "Документы", value: "dokumenty"}
          - {label: "Руководство", value: "rukovodstvo-pedagogicheskiy-sostav"}
        hint: "Если это подраздел другой страницы"
      - label: "Настройки меню"
        name: "menu_settings"
        widget: "object"
        collapsed: true
        fields:
          - {label: "Показывать в боковом меню", name: "show_in_menu", widget: "boolean", default: true}
          - {label: "Идентификатор в меню", name: "menu_identifier", widget: "string", required: false, hint: "Латиницей, без пробелов. Автоматически генерируется если пусто"}
          - {label: "Название в меню", name: "menu_name", widget: "string", required: false, hint: "По умолчанию используется заголовок страницы"}
          - {label: "Порядок в меню", name: "menu_weight", widget: "number", required: false, hint: "По умолчанию используется вес страницы"}
      - label: "Связанные документы"
        name: "assigned_documents"
        widget: "relation"
        collection: "documents"
        search_fields: ["title", "description"]
        value_field: "{{slug}}"
        display_fields: ["title", "category"]
        multiple: true
        required: false
        hint: "Выберите документы, которые должны отображаться на этой странице"
      - {label: "Содержание", name: "body", widget: "markdown"}

  # Document management collection
  - name: "documents"
    label: "Документы для страниц"
    folder: "data/documents"
    format: "json"
    create: true
    slug: "{{title}}"
    media_folder: "/static/documents"
    public_folder: "/documents"
    fields:
      - {label: "Заголовок документа", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text", required: false}
      - label: "Тип документа"
        name: "document_type"
        widget: "select"
        options:
          - {label: "Загруженный файл", value: "file"}
          - {label: "Внешняя ссылка", value: "external"}
        default: "file"
      - label: "Файл"
        name: "file"
        widget: "file"
        required: false
        condition: {field: "document_type", equals: "file"}
        media_folder: "/static/documents"
        public_folder: "/documents"
      - {label: "Внешняя ссылка (автоматически)", name: "external_url", widget: "string", required: false, condition: {field: "document_type", equals: "external"}}
      - label: "Страницы организации"
        name: "pages"
        widget: "select"
        multiple: true
        options:
          - {label: "Основные сведения", value: "osnovnye-svedeniya"}
          - {label: "Структура и органы управления", value: "struktura-i-organy-upravleniya"}
          - {label: "Документы", value: "dokumenty"}
          - {label: "Образование", value: "obrazovanie"}
          - {label: "Образовательные стандарты", value: "obrazovatelnye-standarty"}
          - {label: "Руководство. Педагогический состав", value: "rukovodstvo-pedagogicheskiy-sostav"}
          - {label: "Материально-техническое обеспечение", value: "materialno-tekhnicheskoe-obespechenie"}
          - {label: "Стипендии и меры поддержки", value: "stipendii-i-mery-podderzhki"}
          - {label: "Платные образовательные услуги", value: "platnye-obrazovatelnye-uslugi"}
          - {label: "Финансово-хозяйственная деятельность", value: "finansovo-khozyaystvennaya-deyatelnost"}
          - {label: "Вакантные места", value: "vakantnye-mesta"}
          - {label: "Доступная среда", value: "dostupnaya-sreda"}
          - {label: "Международное сотрудничество", value: "mezhdunarodnoe-sotrudnichestvo"}
          - {label: "Тестовая страница", value: "test"}
        hint: "Выберите страницы где должен появиться документ"
      - label: "Категория документа"
        name: "category"
        widget: "select"
        required: false
        options:
          - {label: "Устав", value: "ustav"}
          - {label: "Положения", value: "polozheniya"}
          - {label: "Приказы", value: "prikazy"}
          - {label: "Образовательные программы", value: "obrazovatelnye-programmy"}
          - {label: "Учебные планы", value: "uchebnye-plany"}
          - {label: "Рабочие программы", value: "rabochie-programmy"}
          - {label: "Отчеты", value: "otchety"}
          - {label: "Другое", value: "other"}
        hint: "Категория для группировки документов"
      - {label: "Дата документа", name: "date", widget: "datetime", default: ""}

